*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans)}
a{color:var(--link);text-decoration:none}a:hover{color:var(--link-h);text-decoration:underline}
button,input{font-family:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.logo{font-weight:700;font-size:16px;color:var(--ink)} .logo:hover{text-decoration:none;color:var(--ink)}
.logo small{font-weight:400;font-size:14px;color:var(--muted);margin-left:8px}
.grow{flex:1 1 auto}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--ctl);border-radius:8px;background:var(--surface);font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--ink2)} .btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
main{max-width:1040px;margin:0 auto;padding:28px 24px 72px;display:flex;flex-direction:column;gap:18px}
@media (max-width:600px){.bar{padding:10px 16px} main{padding:20px 16px 56px}}
h1{margin:0;font-size:26px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
h2{margin:0 0 10px;font-size:16px;font-weight:600}
.lead{margin:0;color:var(--ink2);max-width:72ch}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 24px}
@media (max-width:600px){.card{padding:16px 18px}}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.final{background:var(--ok-bg);color:var(--ok-ink)} .pill.blocked{background:var(--warn-bg);color:var(--warn-ink)}
.pill.in-review{background:var(--info-bg);color:var(--info-ink)} .pill.no-flow{background:var(--none-bg);color:var(--none-ink)}
.pill.draft{background:var(--warn-bg);color:var(--warn-ink)}
.tag{display:inline-block;border-radius:8px;padding:3px 10px;font-size:13px;background:var(--sys-bg);color:var(--sys-ink)}
.tag.who{background:var(--person-bg);color:var(--person-ink)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.id{font:500 11px var(--mono);color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px}
.team-only{display:none} body.team .team-only{display:block} body.team span.team-only{display:inline}
.empty{color:var(--muted);font-style:italic}

/* index */
.hero{display:flex;flex-direction:column;gap:12px;padding:24px 28px}
.progress{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--warn-bar)}
.progress i{display:block;background:var(--ok)}
.key{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.key span{display:inline-flex;gap:6px;align-items:center} .key b{width:10px;height:10px;border-radius:3px;display:inline-block}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 280px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--ctl);border-radius:10px;padding:0 14px;min-height:46px}
.search input{flex:1 1 auto;border:0;outline:none;font-size:15px;background:transparent;min-width:0}
.search:focus-within{border-color:var(--link)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--ctl);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer}
.chip span{opacity:.75;font:500 12px var(--mono);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.module{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.feat{display:flex;flex-direction:column;gap:10px;padding:18px 20px}
.feat .hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.feat h2{margin:0;font-size:17px}
.feat p{margin:0;color:var(--ink2);font-size:14px}
.links{list-style:none;margin:0;padding:0;border-top:1px solid var(--line2)}
.links li{border-bottom:1px solid var(--line2)}
.links a{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;color:var(--ink);font-size:14px}
.links a:hover{color:var(--link);text-decoration:none}
.links .s{display:block;font-size:13px;color:var(--muted)}
.open{font-size:13px;color:var(--warn-ink)}

/* flow page */
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.crumb a{font-weight:500}
.title{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.viewbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{min-height:40px;padding:0 18px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font-size:14px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.steps{list-style:none;margin:0;padding:0}
.steps>li{display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line2)}
.steps>li:first-child{border-top:0}
.num{flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:#fff;background:var(--sys)}
.num.p{background:var(--person)}
.sbody{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.shd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.who{border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--sys-bg);color:var(--sys-ink)}
.who.p{background:var(--person-bg);color:var(--person-ink)}
.stitle{font-weight:600;font-size:16px}
.smeta{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.checks{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.checks li{display:flex;gap:8px;align-items:baseline}
.checks li::before{content:"?";flex:0 0 18px;height:18px;border-radius:50%;background:var(--sys-bg);color:var(--sys-ink);font:600 11px/18px var(--mono);text-align:center;position:relative;top:-1px}
.branch{display:flex;gap:10px;align-items:baseline;border-radius:10px;padding:9px 14px;font-size:14px;background:var(--surface2)}
.branch b{white-space:nowrap}
.branch.exc{background:var(--warn-soft)} .branch.exc b{color:var(--warn-ink)}
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar .pct{min-width:48px;text-align:center;font:600 13px var(--mono);color:var(--muted)}
.toolbar .hint{margin-left:auto;font-size:12px;color:var(--muted)}
.viewport{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--surface2);height:560px;cursor:grab;touch-action:none}
.viewport.drag{cursor:grabbing} .viewport svg{position:absolute;left:0;top:0;transform-origin:0 0}
.viewport.full{position:fixed;inset:0;z-index:50;height:auto;border-radius:0}
.legend{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.keyrow span{display:inline-flex;gap:6px;align-items:center} .keyrow b{width:10px;height:10px;border-radius:3px;display:inline-block}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.facts ul{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px}
.facts .k{color:var(--muted);font-size:13px}
.states{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.state{border-radius:8px;padding:3px 10px;font-size:14px;background:var(--sys-bg);color:var(--sys-ink)}
.state:first-child{background:var(--ok-bg);color:var(--ok-ink)}
details.card{padding:4px 24px}
details.card summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600}
details.card ul{margin:0 0 16px;padding:0 0 0 18px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pager a{display:inline-flex;flex-direction:column;min-height:44px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 16px;color:var(--ink)}
.pager a:hover{text-decoration:none;border-color:var(--ctl)}
.pager a.next{align-items:flex-end;margin-left:auto}
.pager small{font-size:12px;color:var(--muted)} .pager b{font-weight:600}
pre.spec{white-space:pre-wrap;font:12.5px/1.5 var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 12px}
.team h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.copied{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:13px;z-index:60}
body:not(.team) .team-svg{display:none}
@media (max-width:760px){.toolbar .hint{display:none}h1{font-size:22px}}
@media print{
  .top,.toolbar,.tools,.seg,.pager,.no-print{display:none!important}
  body{background:#fff;color:#000;font-size:12pt} main{max-width:none;padding:0}
  details.card{display:block} details.card>*{display:block}
  .viewport{height:auto;overflow:visible;border:0;background:#fff} .viewport svg{position:static;transform:none!important;width:100%;height:auto}
  .card,.steps>li{break-inside:avoid}
}

// ---------------------------------------------------------------- index

    <div class="key"><span><b style="background:var(--ok)"></b>${esc(S.finalKey)}</span><span><b style="background:var(--warn-bar);border:1px solid var(--warn-line)"></b>${esc(S.blockedKey)}</span></div></section>`;
  h += `<div class="tools"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" aria-label="${esc(S.searchL)}" placeholder="${esc(S.search)}" value="${esc(IX.q)}"></label>
    <div class="chips" role="group" aria-label="Status">${["", ...statuses].map(st => `<button type="button" class="chip" data-st="${st}" aria-pressed="${IX.status === st}">${esc(st ? S[st] : S.all)}<span>${st ? L.features.filter(f => f.status === st).length : total}</span></button>`).join("")}</div></div>`;
  if (L.modules.length > 1) h += `<div class="chips" role="group" aria-label="Module">${[["", S.all], ...L.modules.map(m => [m.id, m.name])].map(([id, n]) => `<button type="button" class="chip" data-mod="${esc(id)}" aria-pressed="${IX.module === id}">${esc(n)}</button>`).join("")}</div>`;

  document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { IX.status = b.dataset.st; document.querySelectorAll("[data-st]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); drawIndex(); });
  document.querySelectorAll("[data-mod]").forEach(b => b.onclick = () => { IX.module = b.dataset.mod; document.querySelectorAll("[data-mod]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); drawIndex(); });
  drawIndex();
}
function drawIndex() {
  const q = IX.q.trim().toLowerCase();
  const hit = s => String(s || "").toLowerCase().includes(q);
  let h = "", any = false;
  const multi = L.modules.length > 1;
  for (const m of L.modules) {
    if (IX.module && IX.module !== m.id) continue;
    const cards = m.features.map(feat).filter(f => f && (!IX.status || f.status === IX.status)).map(f => {
      const all = !q || hit(f.title) || hit(f.summary);
      const flows = all ? f.flows : f.flows.filter(fl => hit(fl.title) || hit(fl.summary) || fl.nodes.some(n => hit(n.label)));
      return (all || flows.length) ? { f, flows } : null;
    }).filter(Boolean);
    if (!cards.length) continue;
    any = true;
    if (multi) h += `<div class="module">${esc(m.name)}</div>`;
    h += `<div class="grid">` + cards.map(({ f, flows }) => `<article class="card feat">
      <div class="hd"><h2>${f.flows.length > 1 ? `<a href="#/f/${esc(f.id)}" style="color:inherit">${esc(f.title)}</a>` : esc(f.title)}</h2>${pill(f.status)}</div>
      ${f.summary ? `<p>${esc(f.summary)}</p>` : ""}
      ${flows.length ? `<ul class="links">${flows.map(fl => `<li><a href="#/f/${esc(f.id)}/${esc(fl.id)}"><span>${idt(fl.id)}${esc(fl.title)}</span>${chev}</a></li>`).join("")}</ul>` : `<p class="empty">${esc(S.noFlows)}</p>`}

    </article>`).join("") + `</div>`;
  }
  if (!any) h = `<p class="muted">${esc(S.noMatch(IX.q))}</p>`;
  $("#ix").innerHTML = h;
}

// ---------------------------------------------------------------- flow → plain numbered steps
function buildSteps(fl) {
  const byId = Object.fromEntries(fl.nodes.map(n => [n.id, n]));
  const lane = Object.fromEntries(fl.lanes.map(l => [l.id, l]));
  const out = {}; fl.edges.forEach(e => (out[e.from] ||= []).push(e));
  const isExc = n => n && n.phase === "exception";
  // order: longest path from the start, ignoring back edges; ties by visit order (main path before error branches)
  const order = {}, st = {}, back = new Set(); let k = 0;
  const dfs = id => { st[id] = 1; order[id] = k++;
    for (const e of [...(out[id] || [])].sort((a, b) => isExc(byId[a.to]) - isExc(byId[b.to]))) { if (st[e.to] === 1) back.add(e); else if (!st[e.to]) dfs(e.to); }
    st[id] = 2; };
  fl.nodes.filter(n => n.kind === "start").forEach(n => dfs(n.id)); fl.nodes.forEach(n => st[n.id] || dfs(n.id));
  const rank = {}; fl.nodes.forEach(n => rank[n.id] = 0);
  for (let i = 0; i < fl.nodes.length; i++) for (const e of fl.edges) if (!back.has(e) && byId[e.from] && byId[e.to]) rank[e.to] = Math.max(rank[e.to], rank[e.from] + 1);
  const main = fl.nodes.filter(n => n.kind !== "start" && n.kind !== "end" && !isExc(n)).sort((a, b) => rank[a.id] - rank[b.id] || order[a.id] - order[b.id]);
  // a run of questions asked by the same lane, one leading straight to the next, reads as one "Checks" step
  const items = [];
  for (const n of main) {
    const prev = items[items.length - 1];
    if (n.kind === "decision" && prev?.kind === "decision" && prev.lane === n.lane && (out[prev.nodes[prev.nodes.length - 1].id] || []).some(e => e.to === n.id)) prev.nodes.push(n);
    else items.push({ kind: n.kind, lane: n.lane, nodes: [n] });
  }
  const numOf = {}; items.forEach((it, i) => it.nodes.forEach(n => numOf[n.id] = i + 1));
  const describe = (to, from, keepNext) => {
    const t = byId[to];
    if (!t || t.kind === "end") return { end: true, text: S.flowEnds };
    if (isExc(t)) {
      const chain = []; let cur = t, guard = 0;
      while (cur && isExc(cur) && guard++ < 12) { chain.push(cur.label); const nx = (out[cur.id] || [])[0]; cur = nx ? byId[nx.to] : null; }
      const tail = !cur || cur.kind === "end" ? S.endsHere : (numOf[cur.id] <= from ? S.backTo(numOf[cur.id]) : S.goTo(numOf[cur.id])) + ".";
      return { exc: true, text: chain.join(" → ") + ". " + tail };
    }
    const n = numOf[to];
    if (n === from + 1 && !keepNext) return { next: true };
    return { text: (n <= from ? S.backTo(n) : S.goTo(n)) + " — " + t.label };
  };
  return items.map((it, i) => {
    const num = i + 1, l = lane[it.lane] || {}, first = it.nodes[0];
    const res = { num, who: l.name || "", person: l.kind === "actor", ids: it.nodes.map(n => n.id) };
    if (it.kind === "decision") {
      const inGroup = new Set(it.nodes.map(n => n.id)), br = [];
      it.nodes.forEach(n => (out[n.id] || []).forEach(e => {
        if (inGroup.has(e.to)) return;
        const d = describe(e.to, num); if (d.next) return;
        const same = br.find(b => b.text === d.text);
        if (same) { if (e.label && !same.labels.includes(e.label)) same.labels.push(e.label); } else br.push({ ...d, labels: e.label ? [e.label] : [] });
      }));
      // a real choice between two ways forward: also say where the "carry on" answer goes
      if (br.some(b => !b.exc && !b.end)) it.nodes.forEach(n => (out[n.id] || []).forEach(e => {
        if (!inGroup.has(e.to) && e.label && numOf[e.to] === num + 1) br.unshift({ text: S.goTo(num + 1) + " — " + byId[e.to].label, labels: [e.label] });
      }));
      res.title = it.nodes.length > 1 ? S.checks : first.label;
      res.checks = it.nodes.length > 1 ? it.nodes.map(n => n.label) : [];
      res.branches = br;
    } else {
      res.title = first.label; res.screen = first.screen || ""; res.platform = first.platform || "";
      const es = out[first.id] || [];
      const multi = es.length > 1;
      res.branches = es.map(e => ({ e, d: describe(e.to, num, multi) })).filter(x => !x.d.next && !(x.d.end && num === items.length && !multi))
        .map(x => ({ ...x.d, labels: x.e.label ? [x.e.label] : [multi ? S.or : S.then] }));
    }
    return res;
  });
}

    if (fl.outputs?.length) cards.push(`<section class="card"><h2>${esc(S.produces)}</h2><ul>${fl.outputs.map(r => `<li>${esc(r.output)}${r.when ? ` <span class="k">(${esc(S.when)}: ${esc(r.when)})</span>` : ""}</li>`).join("")}</ul></section>`);

      ${life.transitions?.length ? `<ul style="margin-top:10px">${life.transitions.map(t => `<li>${esc(human(t.from))} → ${esc(human(t.to))}${t.label ? ` <span class="k">— ${esc(t.label)}</span>` : ""}</li>`).join("")}</ul>` : ""}</section>`);

// ---------------------------------------------------------------- swimlane layout (lanes = columns, flow top → bottom)
function wrap(t, n, max = 4) {
  const out = []; let line = "";
  for (const w of String(t || "").split(/\s+/)) {
    if ((line + " " + w).trim().length > n && line) { out.push(line); line = w; } else line = (line + " " + w).trim();
  }
  if (line) out.push(line);
  if (out.length > max) { out.length = max; out[max - 1] = out[max - 1].replace(/\s*\S*$/, "") + "…"; }
  return out;
}
function swimlane(fl) {

  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const out = {}, inc = {};
  fl.edges.forEach(e => { (out[e.from] ||= []).push(e); (inc[e.to] ||= []).push(e); });
  // rank = longest path from the starts, ignoring back edges (DFS order)
  const state = {}, back = new Set();
  const dfs = id => { state[id] = 1; for (const e of out[id] || []) { if (state[e.to] === 1) back.add(e); else if (!state[e.to]) dfs(e.to); } state[id] = 2; };
  nodes.filter(n => n.kind === "start").forEach(n => dfs(n.id)); nodes.forEach(n => state[n.id] || dfs(n.id));
  const rank = {}; nodes.forEach(n => rank[n.id] = 0);
  for (let it = 0; it < nodes.length; it++) for (const e of fl.edges) if (!back.has(e) && byId[e.from] && byId[e.to]) rank[e.to] = Math.max(rank[e.to], rank[e.from] + 1);
  // ends sit below everything that reaches them
  // data nodes from inputs / outputs, placed beside the step they feed or come from
  const data = [];
  (fl.inputs || []).forEach(r => r.node && byId[r.node] && data.push({ id: "in:" + r.no, label: r.input, kind: "data", lane: (fl.lanes.find(l => l.kind === "input") || {}).id, rank: rank[r.node], to: r.node }));
  (fl.outputs || []).forEach(r => r.node && byId[r.node] && data.push({ id: "out:" + r.no, label: r.output, kind: "data", lane: (fl.lanes.find(l => l.kind === "output") || {}).id, rank: rank[r.node], from: r.node }));
  // lane columns: width = most nodes on one rank
  const cells = {};
  [...nodes, ...data].forEach(n => { if (n.rank === undefined) n.rank = rank[n.id]; const k = n.lane + "|" + n.rank; (cells[k] ||= []).push(n); });
  const laneCols = {}; fl.lanes.forEach(l => laneCols[l.id] = 1);
  Object.entries(cells).forEach(([k, arr]) => { const ln = k.split("|")[0]; laneCols[ln] = Math.max(laneCols[ln] || 1, arr.length); });
  const laneX = {}; let x = 0;
  const lw = l => laneCols[l.id] * (NW + PAD) + PAD;
  fl.lanes.forEach(l => { laneX[l.id] = x; x += lw(l); });
  const W = x, maxRank = Math.max(0, ...nodes.map(n => rank[n.id]), ...data.map(d => d.rank || 0)), H = TITLE + HEAD + (maxRank + 1) * RH + PAD;
  Object.entries(cells).forEach(([k, arr]) => {
    const [ln] = k.split("|"); const l = fl.lanes.find(z => z.id === ln); if (!l) return;
    const span = lw(l), used = arr.length * (NW + PAD) - PAD;
    arr.forEach((n, i) => { n.x = laneX[ln] + (span - used) / 2 + i * (NW + PAD); n.y = TITLE + HEAD + n.rank * RH + (RH - NH) / 2; });
  });
  const pos = id => byId[id] || data.find(d => d.id === id);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="IBM Plex Sans,system-ui,sans-serif">
    <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>
    <rect x="0" y="0" width="${W}" height="${TITLE}" fill="var(--head)"/><text x="${W / 2}" y="${TITLE / 2 + 5}" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">${esc(fl.title)}</text>`;
  fl.lanes.forEach((l, i) => {
    s += `<rect x="${laneX[l.id]}" y="${TITLE}" width="${lw(l)}" height="${H - TITLE}" fill="${i % 2 ? "var(--lane2)" : "var(--lane)"}" stroke="var(--line)"/>
      <rect x="${laneX[l.id]}" y="${TITLE}" width="${lw(l)}" height="${HEAD}" fill="var(--surface)" stroke="var(--line)"/>
      <text x="${laneX[l.id] + lw(l) / 2}" y="${TITLE + HEAD / 2 + 5}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">${esc(l.name)}</text>`;
  });
  // edges
  const centerX = n => n.x + NW / 2;
  const drawEdge = (a, b, label, isBack, dashed) => {
    if (!a || !b) return;
    let d, lx, ly;
    if (a.kind === "data" && b.kind !== "data") { const y = b.y + NH / 2, x1 = a.x + NW, x2 = b.x; d = `M${x1} ${y} H${x2 - 2}`; lx = (x1 + x2) / 2; ly = y - 6; }
    else if (b.kind === "data") { const y = a.y + NH / 2, x1 = a.x + NW, x2 = b.x; d = x2 > x1 ? `M${x1} ${y} H${x2 - 2}` : `M${a.x} ${y} H${b.x + NW + 2}`; lx = (x1 + x2) / 2; ly = y - 6; }
    else if (isBack) { const sx = a.x + NW, sy = a.y + NH / 2, tx = b.x + NW, ty = b.y + NH / 2, ox = Math.max(sx, tx) + 18 + (Math.abs(a.y - b.y) / RH) * 4;
      d = `M${sx} ${sy} H${ox} V${ty} H${tx + 2}`; lx = ox + 4; ly = (sy + ty) / 2; }
    else { const sx = centerX(a), sy = a.y + NH, tx = centerX(b), ty = b.y, my = sy + (ty - sy) / 2;
      d = sx === tx ? `M${sx} ${sy} V${ty - 2}` : `M${sx} ${sy} V${my} H${tx} V${ty - 2}`; lx = sx === tx ? sx + 6 : (sx + tx) / 2; ly = my - 4; }
    s += `<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#ar)"${dashed ? ' stroke-dasharray="5 4"' : ""}/>`;
    if (label) s += `<text x="${lx}" y="${ly}" font-size="11.5" fill="var(--ink)" text-anchor="middle" paint-order="stroke" stroke="var(--surface2)" stroke-width="4">${esc(label)}</text>`;
  };
  fl.edges.forEach(e => drawEdge(byId[e.from], byId[e.to], e.label, back.has(e) || (byId[e.to] && byId[e.from] && rank[e.to] <= rank[e.from])));
  data.forEach(dn => dn.to ? drawEdge(dn, byId[dn.to], "", false, true) : drawEdge(byId[dn.from], dn, "", false, true));
  // nodes
  const label = (n, cx, cy, size = 12.5, max = 24, lines = 4) => { const ls = wrap(n.label, max, lines); return ls.map((t, i) => `<text x="${cx}" y="${cy + (i - (ls.length - 1) / 2) * 14 + 4}" text-anchor="middle" font-size="${size}" fill="var(--ink)">${esc(t)}</text>`).join(""); };
  [...nodes, ...data].forEach(n => {
    if (n.x === undefined) return;
    const cx = n.x + NW / 2, cy = n.y + NH / 2, exc = n.phase === "exception", stroke = exc ? "var(--bad)" : "var(--head)", dash = exc ? ' stroke-dasharray="5 4"' : "";
    const tip = `<title>${esc(n.label)}${n.ref ? " · " + esc(n.ref) : ""}</title>`;
    if (n.kind === "start" || n.kind === "end") {
      s += `<g>${tip}<rect x="${cx - 55}" y="${cy - 18}" width="110" height="36" rx="18" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>${label({ label: n.kind === "start" ? S.start : S.end }, cx, cy, 13)}</g>`;
    } else if (n.kind === "decision") {
      s += `<g>${tip}<path d="M${cx} ${n.y - 4} L${n.x + NW - 8} ${cy} L${cx} ${n.y + NH + 4} L${n.x + 8} ${cy} Z" fill="var(--surface)" stroke="${exc ? "var(--bad)" : "var(--ink)"}" stroke-width="1.5"${dash}/>${label(n, cx, cy, 11.5, 20, 3)}</g>`;
    } else if (n.kind === "data") {
      s += `<g>${tip}<path d="M${n.x + 14} ${n.y + 6} H${n.x + NW} L${n.x + NW - 14} ${n.y + NH - 6} H${n.x} Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.2"/>${label(n, cx, cy, 12, 26)}</g>`;
    } else {
      const top = n.screen ? 16 : 0, plat = n.platform || "";
      s += `<g>${tip}<rect x="${n.x}" y="${n.y}" width="${NW}" height="${NH}" rx="5" fill="var(--surface)" stroke="${stroke}" stroke-width="1.5"${dash}/>`;
      if (top) s += `<rect x="${n.x}" y="${n.y}" width="${NW}" height="${top}" rx="5" fill="var(--surface2)"/><text x="${cx}" y="${n.y + 12}" text-anchor="middle" font-size="10" fill="var(--muted)">▣ ${esc(wrap(n.screen, 30)[0])}</text>`;
      s += label(n, cx, n.y + top + (NH - top - (plat ? 18 : 0)) / 2, 12, 26, 3);
      if (plat) { const pw = Math.min(NW - 40, plat.length * 7 + 18), col = /system|auto/i.test(plat) ? "var(--sysc)" : /master|data/i.test(plat) ? "var(--data)" : "var(--web)";
        s += `<rect x="${cx - pw / 2}" y="${n.y + NH - 18}" width="${pw}" height="14" rx="2" fill="${col}"/><text x="${cx}" y="${n.y + NH - 7.5}" text-anchor="middle" font-size="10" fill="#fff">${esc(plat)}</text>`; }
      if (n.ref && n.kind === "step") s += `<text class="team-svg" x="${n.x + NW - 4}" y="${n.y + NH + 11}" text-anchor="end" font-size="9.5" font-family="IBM Plex Mono,monospace" fill="var(--muted)">${esc(n.id)}</text>`;
      s += `</g>`;
    }
  });
  return s + `</svg>`;
}

// ---------------------------------------------------------------- lifecycle diagram
function lifecycleSvg(l) {
  const BW = 150, BH = 44, GAP = 90, W = l.states.length * (BW + GAP) + 40, H = 200;
  const X = i => 20 + i * (BW + GAP), Y = H / 2 - BH / 2;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="IBM Plex Sans,system-ui,sans-serif">
    <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>`;
  const seen = {};
  (l.transitions || []).forEach(t => {
    const a = l.states.indexOf(t.from), b = l.states.indexOf(t.to); if (a < 0 || b < 0) return;
    const key = a + ">" + b; seen[key] = (seen[key] || 0) + 1; if (seen[key] > 1) return;
    const fwd = b > a, x1 = X(a) + BW / 2, x2 = X(b) + BW / 2, lift = 30 + Math.abs(b - a) * 14, yy = fwd ? Y - lift : Y + BH + lift, y0 = fwd ? Y : Y + BH;
    s += `<path d="M${x1} ${y0} C${x1} ${yy}, ${x2} ${yy}, ${x2} ${y0 + (fwd ? -2 : 2)}" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#ar2)"/>`;
    if (t.label) s += `<text x="${(x1 + x2) / 2}" y="${fwd ? yy + 10 : yy - 4}" text-anchor="middle" font-size="11.5" fill="var(--ink)" paint-order="stroke" stroke="var(--surface2)" stroke-width="4">${esc(t.label)}</text>`;
  });
  l.states.forEach((st, i) => s += `<rect x="${X(i)}" y="${Y}" width="${BW}" height="${BH}" rx="10" fill="var(--surface)" stroke="var(--head)" stroke-width="1.6"/>
    <text x="${X(i) + BW / 2}" y="${Y + BH / 2 + 5}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">${esc(human(st))}</text>`);
  return s + `</svg>`;
}

// ---------------------------------------------------------------- zoom / pan / full screen
function zoomable(vp, pctSel) {
  const svg = vp.querySelector("svg"); if (!svg) return () => {};
  const W = +svg.getAttribute("width"), H = +svg.getAttribute("height");
  let k = 1, tx = 0, ty = 0;
  const apply = () => { svg.style.transform = `translate(${tx}px,${ty}px) scale(${k})`; if (pctSel) $(pctSel).textContent = Math.round(k * 100) + "%"; };
  const fit = mode => { const r = vp.getBoundingClientRect(); k = mode === "w" ? r.width / W : Math.min(r.width / W, r.height / H); k = Math.max(.1, Math.min(k, 2.5)); tx = Math.max(0, (r.width - W * k) / 2); ty = mode === "w" ? 0 : Math.max(0, (r.height - H * k) / 2); apply(); };
  vp.addEventListener("wheel", e => { if (!e.ctrlKey) return; e.preventDefault(); const r = vp.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, nk = Math.max(.1, Math.min(3, k * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    tx = mx - (mx - tx) * nk / k; ty = my - (my - ty) * nk / k; k = nk; apply(); }, { passive: false });
  let drag = null;
  vp.addEventListener("pointerdown", e => { drag = { x: e.clientX - tx, y: e.clientY - ty }; vp.classList.add("drag"); vp.setPointerCapture(e.pointerId); });
  vp.addEventListener("pointermove", e => { if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); });
  vp.addEventListener("pointerup", () => { drag = null; vp.classList.remove("drag"); });
  const api = cmd => {
    if (cmd === "+" || cmd === "-") { k = Math.max(.1, Math.min(3, k * (cmd === "+" ? 1.2 : 1 / 1.2))); apply(); }
    else if (cmd === "w" || cmd === "v") fit(cmd);
    else if (cmd === "1") { k = 1; tx = 0; ty = 0; apply(); }
    else if (cmd === "f") { vp.classList.toggle("full"); setTimeout(() => fit("v"), 30); }
  };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && vp.classList.contains("full")) { vp.classList.remove("full"); fit("w"); } });
  requestAnimationFrame(() => fit("w"));
  return api;
}

// ---------------------------------------------------------------- copy for AI
function copyForAI(f, fl) {
  const lane = Object.fromEntries(fl.lanes.map(l => [l.id, l.name]));
  const node = Object.fromEntries(fl.nodes.map(n => [n.id, n]));
  const lines = [`# ${fl.title} (${fl.id})`, `${L.product} · ${f.module} · ${f.title} · ${S[f.status]}`, "", fl.summary || "", "",
    `## ${S.lanes}`, ...fl.lanes.map(l => `- ${l.name} (${l.kind})`), "", `## ${S.steps}`,
    ...fl.nodes.map(n => `- [${n.id}] ${n.kind === "decision" ? "◇ " : ""}${n.label} — ${lane[n.lane] || ""}${n.screen ? " · " + n.screen : ""}${n.platform ? " · " + n.platform : ""}${n.phase ? " · " + n.phase : ""}`),
    "", `## ${S.branches}`, ...fl.edges.map(e => `- ${node[e.from]?.label || e.from} → ${node[e.to]?.label || e.to}${e.label ? ` [${e.label}]` : ""}`),
    "", `## ${S.input}`, ...(fl.inputs || []).map(r => `- ${r.no} ${r.input} (${r.type}) → ${r.goesTo}`),
    "", `## ${S.output}`, ...(fl.outputs || []).map(r => `- ${r.no} ${r.output}${r.when ? " — " + r.when : ""}`)];
  const tm = fl.team || {};
  for (const [k, t] of [["reqs", S.reqs], ["rules", S.rules], ["acceptance", S.acc]]) if (tm[k]?.length) lines.push("", `## ${t}`, ...tm[k].map(x => `- ${x.id} ${x.title}: ${x.text.replace(/\n/g, " / ")}`));
  const text = lines.join("\n");
  const done = () => { const d = document.createElement("div"); d.className = "copied"; d.textContent = S.copied; document.body.append(d); setTimeout(() => d.remove(), 1600); };
  (navigator.clipboard?.writeText(text) || Promise.reject()).then(done, () => { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand("copy"); } catch {} ta.remove(); done(); });
}

// ---------------------------------------------------------------- router
function render(keepScroll) {
  const p = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (p[0] === "f" && feat(p[1])) {
    const f = feat(p[1]);
    const fl = p[2] ? f.flows.find(x => x.id === p[2]) : (f.flows.length === 1 ? f.flows[0] : null);
    fl ? renderFlow(f, fl) : renderFeature(f);
    document.title = `${fl ? fl.title : f.title} · ${L.product}`;
  } else { renderIndex(); document.title = `${L.product} — ${S.library}`; }
  if (!keepScroll) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => render());
render();
