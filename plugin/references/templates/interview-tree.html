<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f7f9; --surface:#ffffff; --ink:#1b1d21; --ink2:#3a3e45; --muted:#5b606a;
    --line:#e2e4e8; --line2:#eef0f2; --ctl:#d0d3d9; --seg:#eef0f2; --link:#2f5d99;
    --guess-bg:#fff3e0; --guess:#8a4f00; --guess-dot:#c77a12; --guess-line:#f2d9b3; --guess-soft:#fffaf2;
    --unk-bg:#f1ebfb; --unk:#5b34a0; --unk-dot:#7a4fc4; --unk-line:#dccdf3; --unk-soft:#faf7fe;
    --ok-bg:#eaf5ee; --ok:#17552f; --bad-bg:#fbeceb; --bad:#8c2723; --dot:#9aa0aa;
    --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0f1114; --surface:#17191d; --ink:#e6e7ea; --ink2:#c4c7cd; --muted:#9a9fa8;
      --line:#2a2e35; --line2:#22262c; --ctl:#3a3f47; --seg:#22262c; --link:#8db4e8;
      --guess-bg:#3a2a12; --guess:#f0b766; --guess-dot:#e09a3a; --guess-line:#5a4220; --guess-soft:#221a10;
      --unk-bg:#2c2240; --unk:#c6a8f5; --unk-dot:#a07ee0; --unk-line:#463566; --unk-soft:#1d1828;
      --ok-bg:#163222; --ok:#7fd3a0; --bad-bg:#3a1a19; --bad:#f19a95; --dot:#6b717b;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0f1114; --surface:#17191d; --ink:#e6e7ea; --ink2:#c4c7cd; --muted:#9a9fa8;
    --line:#2a2e35; --line2:#22262c; --ctl:#3a3f47; --seg:#22262c; --link:#8db4e8;
    --guess-bg:#3a2a12; --guess:#f0b766; --guess-dot:#e09a3a; --guess-line:#5a4220; --guess-soft:#221a10;
    --unk-bg:#2c2240; --unk:#c6a8f5; --unk-dot:#a07ee0; --unk-line:#463566; --unk-soft:#1d1828;
    --ok-bg:#163222; --ok:#7fd3a0; --bad-bg:#3a1a19; --bad:#f19a95; --dot:#6b717b;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .mono{font-family:var(--mono)}
  button{font-family:inherit;color:inherit}

  /* top bar */
  header.top{background:var(--surface);border-bottom:1px solid var(--line)}
  .bar{max-width:1040px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
  .wordmark{font-weight:700;font-size:16px}
  .wordmark small{font-weight:400;font-size:14px;color:var(--muted);margin-left:8px}
  .grow{flex:1 1 auto}
  .who{font-size:13px;color:var(--muted)}
  .seg{display:inline-flex;background:var(--seg);border-radius:10px;padding:3px}
  .seg a{display:inline-flex;align-items:center;min-height:38px;padding:0 16px;border-radius:8px;color:var(--ink2);font-size:14px;font-weight:500;text-decoration:none}
  .seg a:hover{color:var(--ink)}
  .seg a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
  .btn{min-height:44px;padding:0 14px;border:1px solid var(--ctl);border-radius:8px;background:var(--surface);font-size:14px;font-weight:500;cursor:pointer}
  .btn:hover{border-color:var(--ink2)}
  .btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

  main{max-width:1040px;margin:0 auto;padding:28px 24px 64px;display:flex;flex-direction:column;gap:20px}
  @media (max-width:600px){.bar{padding:12px 16px} main{padding:20px 16px 48px}}

  /* summary */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 24px}
  .summary{display:flex;flex-direction:column;gap:16px;padding:24px 28px}
  @media (max-width:600px){.card{padding:16px 18px}.summary{padding:20px}}
  .pill{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
  .pill.none{background:var(--guess-bg);color:var(--guess)}
  .pill.expected{background:var(--unk-bg);color:var(--unk)}
  .pill.available{background:var(--ok-bg);color:var(--ok)}
  h1{margin:0;font-size:24px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
  .glance{margin:0;color:var(--ink2);max-width:75ch}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .stat{border:1px solid var(--line);border-radius:10px;padding:12px 16px}
  .stat b{display:block;font-size:26px;font-weight:700;line-height:1.3}
  .stat span{font-size:13px;color:var(--muted)}
  .stat.guess{border-color:var(--guess-line);background:var(--guess-soft)} .stat.guess b{color:var(--guess)}
  .stat.unk{border-color:var(--unk-line);background:var(--unk-soft)} .stat.unk b{color:var(--unk)}
  .stat.chk b{font-size:18px;padding:5px 0 4px}

  /* tabs */
  .tabs{display:flex;flex-wrap:wrap;gap:8px}
  .tab{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--ctl);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .panel{display:flex;flex-direction:column;gap:16px}
  .panel.gridded{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .panel.gridded .wide{grid-column:1/-1}
  .panel[hidden]{display:none}
  h2{margin:0 0 6px;font-size:16px;font-weight:600}
  h2 .n{font:500 12px var(--mono);color:var(--muted);margin-left:6px}
  .printhead{display:none}

  /* rows */
  .rows{display:flex;flex-direction:column}
  .row{display:flex;flex-wrap:wrap;gap:4px 16px;padding:11px 0;border-top:1px solid var(--line2);align-items:baseline}
  .row:first-child{border-top:0}
  .row .t{flex:0 0 200px;font-weight:600}
  .row .d{flex:1 1 300px;color:var(--ink2)}
  .row .m{font:500 12px var(--mono);color:var(--muted)}
  .row .q{flex:0 0 28px;font:600 13px var(--mono);color:var(--unk)}
  @media (max-width:600px){.row .t{flex-basis:100%}}
  .empty{color:var(--muted);font-style:italic;font-size:14px}
  .steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .steps li{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
  .steps .k{font:600 12px var(--mono);color:var(--link)}
  .steps .t{font-weight:600}
  .steps .d{font-size:14px;color:var(--ink2)}
  .steps .m{font-size:13px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border-radius:8px;padding:4px 10px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
  .chip.in{background:var(--ok-bg);color:var(--ok)} .chip.out{background:var(--bad-bg);color:var(--bad)} .chip.unsure{background:var(--unk-bg);color:var(--unk)}
  h2.in{color:var(--ok)} h2.out{color:var(--bad)} h2.unsure{color:var(--unk)}

  /* flags: only uncertain or checked points carry one */
  .fl{border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;white-space:nowrap}
  .fl-guess{background:var(--guess-bg);color:var(--guess)}
  .fl-unk{background:var(--unk-bg);color:var(--unk)}
  .fl-bad{background:var(--bad-bg);color:var(--bad)}
  .fl-ok{background:var(--ok-bg);color:var(--ok)}

  /* tree */
  .treebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .root{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:2px 6px 12px;border-bottom:1px solid var(--line2)}
  .root b{font-size:17px}
  .root .d{color:var(--ink2);font-size:14px;flex:1 1 300px}
  .root .m{font-size:13px;color:var(--muted)}
  ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
  ul.tree{padding-top:8px}
  ul.tree ul{margin:0 0 6px 15px;padding-left:18px;border-left:1px solid var(--line)}
  .node{display:flex;width:100%;gap:10px;align-items:center;min-height:44px;padding:0 6px;border:0;background:transparent;text-align:left;cursor:pointer;border-radius:8px}
  .node:hover{background:var(--seg)}
  .node.sec{min-height:40px;gap:8px}
  .node .nm{font-weight:700;font-size:16px}
  .node.sec .nm{font-weight:600;font-size:15px}
  .node .c{font:500 12px var(--mono);color:var(--muted)}
  .chev{display:inline-flex;width:18px;justify-content:center;transition:transform .15s}
  [aria-expanded="true"]>.node .chev{transform:rotate(90deg)}
  .leaf{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;padding:7px 6px}
  .leaf .dot{flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:var(--dot);position:relative;top:-2px}
  .leaf .dot.guess{background:var(--guess-dot)} .leaf .dot.unk{background:var(--unk-dot)} .leaf .dot.bad{background:var(--bad)}
  .leaf .t{font-weight:600}
  .leaf .d{color:var(--ink2);flex:1 1 280px}
  .leaf .m{font:500 12px var(--mono);color:var(--muted)}

  footer{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}

  @media print{
    header.top .seg,header.top .btn,.tabs,.treebar{display:none!important}
    body{background:#fff;font-size:12pt}
    .panel[hidden]{display:flex!important}
    .panel.gridded[hidden]{display:grid!important}
    .printhead{display:block;margin:16px 0 0;font-size:18px}
    .card,.steps li{break-inside:avoid}
    main{max-width:none;padding:0}
  }
</style>
</head>
<body>

    {label:"Line manager", type:"ASSUMPTION", check:"contradicted", text:"Approves bookings above a cost threshold — BA thinks this is the case for vehicles only.", role:"decides"},
    {label:"Finance", type:"UNKNOWN", check:"unchecked", text:"Unclear whether finance needs reports on equipment usage.", role:"affected"}
  ],
  process: [
    {label:"Request by email", type:"FACT", check:"matched", actor:"Employee", tool:"Email", text:"Emails the site coordinator with resource, date and purpose."},

  ],

  ],

  ],

  ],
  materials: [

<header class="top">
  <div class="bar">
    <span class="wordmark"><span id="projName"></span><small>Project brief</small></span>
    <span class="grow"></span>
    <span class="who" id="who"></span>
    <div class="seg" role="group" aria-label="View">
      <a href="interview.html">Tabs</a>
      <a aria-current="page" href="interview-tree.html">Tree</a>
    </div>
    <button type="button" class="btn" id="printBtn" title="Print or save as PDF">Print</button>
    <button type="button" class="btn" id="themeBtn" title="Switch light / dark">Theme</button>
  </div>
</header>
<main>
  <section class="card summary" id="summary"></section>
  <div id="treeView" style="display:flex;flex-direction:column;gap:16px"></div>
  <footer id="foot"></footer>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list=k=>Array.isArray(BRIEF[k])?BRIEF[k]:[];
const basis=BRIEF.basis||{materials:"none"};
const checked=basis.materials!=="none"&&!!basis.groundedAt;

// Only uncertain or checked points carry a flag; everything the BA is sure of stays plain.
const TYPE_FLAG={ASSUMPTION:["guess","Guess — confirm"],UNKNOWN:["unk","Unknown"],CONFLICT:["bad","Conflict"]};
const RCV={yes:["ok","Received"],no:["bad","Not received"],expected:["guess","Expected"]};
function flagsOf(i){
  let h="";
  if(i.isQ){ if(i.check==="matched")h+=`<span class="fl fl-ok">✓ Answered by materials</span>`; return h; }
  if(i.received&&RCV[i.received])return `<span class="fl fl-${RCV[i.received][0]}">${RCV[i.received][1]}</span>`;
  if(TYPE_FLAG[i.type])h+=`<span class="fl fl-${TYPE_FLAG[i.type][0]}">${TYPE_FLAG[i.type][1]}</span>`;
  if(i.check==="contradicted")h+=`<span class="fl fl-bad">✗ Materials disagree</span>`;
  else if(i.check==="matched")h+=`<span class="fl fl-ok">✓ Matches materials</span>`;
  return h;
}
const needsCheck=i=>i.isQ?i.check!=="matched":(!!TYPE_FLAG[i.type]||i.check==="contradicted");
const dotOf=i=>i.check==="contradicted"||i.type==="CONFLICT"?"bad":i.isQ||i.type==="UNKNOWN"?"unk":i.type==="ASSUMPTION"?"guess":"";

const TOPICS=["actors","process","pains","goals","scope","rules","volumes","outputs","systems","data","constraints","risks"];
const all=TOPICS.flatMap(list);
const terms=list("terms").map(t=>({label:t.term,text:t.meaning,type:t.type,check:t.check}));
const questions=list("questions").map(q=>({...q,isQ:true}));

// One model feeds both views: branch → section → points.
function model(){
  const scope=k=>list("scope").filter(i=>(i.kind||"unsure")===k);
  const everything=[...all,...terms];
  const ask=[
    {id:"questions",name:"Questions for the customer",items:questions,numbered:true,keep:true},
    {id:"guesses",name:"Guesses to confirm",items:everything.filter(i=>i.type==="ASSUMPTION")},
    {id:"conflicts",name:"Materials disagree",items:everything.filter(i=>i.check==="contradicted"||i.type==="CONFLICT")}
  ];
  if(basis.materials!=="none")ask.push({id:"materials",name:"Materials to expect",keep:true,
    items:list("materials").map(m=>({label:m.name,text:m.contains,meta:m.lookFor?"look for: "+m.lookFor:"",received:m.received}))});
  const B=[
    {id:"overview",name:"Overview",grid:true,sections:[
      {id:"pains",name:"What hurts today",items:list("pains"),keep:true},
      {id:"goals",name:"What “better” looks like",items:list("goals"),meta:i=>i.measure?"measure: "+i.measure:"",keep:true},
      {id:"volumes",name:"Size of it",items:list("volumes"),keep:true,wide:true}]},
    {id:"people",name:"People & today",sections:[
      {id:"actors",name:"Who is involved",items:list("actors"),meta:i=>i.role,keep:true},
      {id:"process",name:"How it works today",items:list("process"),meta:i=>[i.actor,i.tool&&("via "+i.tool)].filter(Boolean).join(" · "),steps:true,keep:true},
      {id:"systems",name:"Systems in use",items:list("systems"),meta:i=>i.fate,keep:true}]},
    {id:"scope",name:"Scope & rules",sections:[
      {id:"in",name:"In scope",items:scope("in"),chips:"in",keep:true},
      {id:"out",name:"Out of scope",items:scope("out"),chips:"out",keep:true},
      {id:"unsure",name:"Not decided",items:scope("unsure"),chips:"unsure"},
      {id:"rules",name:"Rules",items:list("rules"),keep:true},
      {id:"outputs",name:"Outputs & notifications",items:list("outputs"),keep:true},
      {id:"constraints",name:"Limits",items:list("constraints"),meta:i=>i.kind,keep:true},
      {id:"risks",name:"Risks",items:list("risks"),keep:true}]},
    {id:"words",name:"Words & data",grid:true,sections:[
      {id:"terms",name:"Words they use",items:terms,keep:true},
      {id:"data",name:"What they record",items:list("data"),keep:true}]},
    {id:"ask",name:"To ask",sections:ask}
  ];
  B.forEach(b=>{b.sections=b.sections.filter(s=>s.keep||s.items.length);});
  return B;
}
const MODEL=model();
const askCount=questions.filter(needsCheck).length+all.concat(terms).filter(i=>i.type==="ASSUMPTION"||i.check==="contradicted"||i.type==="CONFLICT").length;

function summary(){
  const ses=list("sessions");
  const bas=[...new Set(ses.map(s=>s.ba).filter(Boolean))].join(", ");
  const last=ses.length?ses[ses.length-1].date:"";
  $("#who").textContent=`Interview${ses.length>1?` · ${ses.length} sessions`:""}${last?` · ${last}`:""}${bas?` · ${bas}`:""}`;
  const pill=basis.materials==="none"?["none","Based on the BA interview only — no customer materials"]
    :checked?["available",`Checked against ${basis.files} customer file(s), grounded ${basis.groundedAt}`]
    :basis.materials==="available"?["expected",`${basis.files} customer file(s) received, not checked yet — run /protoflow-ground`]
    :["expected","Customer materials expected — points not checked yet"];
  const n=t=>all.filter(i=>i.type===t).length;
  const nck=c=>[...all,...terms,...questions].filter(i=>i.check===c).length;
  $("#summary").innerHTML=`<span class="pill ${pill[0]}">${esc(pill[1])}</span>
    <p class="glance">${esc(BRIEF.glance)||'<span class="empty">No summary yet.</span>'}</p>
    <div class="stats">
      <div class="stat"><b>${n("FACT")}</b><span>points the BA knows</span></div>
      <div class="stat guess"><b>${n("ASSUMPTION")}</b><span>guesses to confirm</span></div>
      <div class="stat unk"><b>${questions.length}</b><span>questions to ask the customer</span></div>
      ${checked?`<div class="stat chk"><b><span style="color:var(--ok)">${nck("matched")} ✓</span> · <span style="color:var(--bad)">${nck("contradicted")} ✗</span></b><span>match · disagree with materials</span></div>`:""}
    </div>`;
}

// view state — remembered per browser, never required
const S={only:false,open:null};
try{const s=JSON.parse(localStorage.getItem("pf-brief-tree")||"{}"); if(s.open&&typeof s.open==="object")S.open=s.open;}catch(e){}
if(!S.open){S.open={};MODEL.forEach(b=>{S.open[b.id]=true;});}
const save=()=>{try{localStorage.setItem("pf-brief-tree",JSON.stringify({open:S.open}));}catch(e){}};

function treeView(){
  const only=S.only;
  // guesses / conflicts under "To ask" repeat points listed elsewhere — count each point once
  const own=MODEL.flatMap(b=>b.sections).filter(s=>s.id!=="guesses"&&s.id!=="conflicts");
  const total=own.reduce((x,s)=>x+s.items.length,0);
  const flagged=own.reduce((x,s)=>x+s.items.filter(needsCheck).length,0);
  const chev=`<span class="chev" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>`;
  const leaf=(i,s,k)=>{const m=s.meta?s.meta(i):i.meta;return `<li class="leaf"><span class="dot ${dotOf(i)}"></span>
    ${i.label?`<span class="t">${s.numbered?`Q${k+1} · `:s.steps?`${k+1}. `:""}${esc(i.label)}</span>`:""}<span class="d">${esc(i.text)}</span>
    ${m?`<span class="m">${esc(m)}</span>`:""}${flagsOf(i)}</li>`;};
  let body=MODEL.map(b=>{
    const secs=b.sections.map(s=>({s,items:s.items.map((i,k)=>({i,k})).filter(x=>!only||needsCheck(x.i))})).filter(x=>!only||x.items.length);
    if(only&&!secs.length)return "";
    const nFlag=b.sections.reduce((x,s)=>x+s.items.filter(needsCheck).length,0);
    const nAll=b.sections.reduce((x,s)=>x+s.items.length,0);
    const bOpen=only||!!S.open[b.id];
    return `<li role="treeitem" aria-expanded="${bOpen}"><button type="button" class="node" data-act="node" data-v="${b.id}">${chev}
      <span class="nm">${esc(b.name)}</span><span class="c">${nAll}</span>${nFlag?`<span class="fl fl-guess">${nFlag} to check</span>`:""}</button>
      ${bOpen?`<ul role="group">${secs.map(({s,items})=>{const sOpen=only||!!S.open[b.id+"/"+s.id];
        return `<li role="treeitem" aria-expanded="${sOpen}"><button type="button" class="node sec" data-act="node" data-v="${b.id}/${s.id}">${chev}
          <span class="nm">${esc(s.name)}</span><span class="c">${items.length}</span></button>
          ${sOpen?(items.length?`<ul role="group">${items.map(x=>leaf(x.i,s,x.k)).join("")}</ul>`:`<ul role="group"><li class="leaf"><span class="empty">Not covered yet.</span></li></ul>`):""}</li>`;}).join("")}</ul>`:""}</li>`;
  }).join("");
  if(!body)body=`<li class="leaf"><span class="empty">Nothing left to check.</span></li>`;
  $("#treeView").innerHTML=`<div class="treebar"><span class="grow"></span>
      <button type="button" class="btn" data-act="only" aria-pressed="${only}">Only what needs checking</button>
      <button type="button" class="btn" data-act="all" data-v="1">Expand all</button>
      <button type="button" class="btn" data-act="all" data-v="0">Collapse all</button></div>
    <section class="card" aria-label="Brief outline">
      <div class="root"><b>${esc(BRIEF.project)}</b><span class="m">${total} points · ${flagged} to check</span></div>
      <ul class="tree" role="tree">${body}</ul>
    </section>`;
}

function render(){ treeView(); }

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  if(a==="node")S.open[v]=!S.open[v];
  else if(a==="only")S.only=!S.only;
  else if(a==="all"){S.open={};MODEL.forEach(b=>{S.open[b.id]=v==="1";b.sections.forEach(s=>{S.open[b.id+"/"+s.id]=v==="1";});});}
  else return;
  save(); render();
  $(`[data-act="${a}"]${v?`[data-v="${v}"]`:""}`)?.focus();
});

(function(){
  try{const t=localStorage.getItem("pf-theme"); if(t)document.documentElement.dataset.theme=t;}catch(e){}
  $("#themeBtn").onclick=()=>{
    const cur=document.documentElement.dataset.theme;
    const next=cur==="dark"?"light":(cur==="light"?"":"dark");
    if(next)document.documentElement.dataset.theme=next; else delete document.documentElement.dataset.theme;
    try{localStorage.setItem("pf-theme",next);}catch(e){}
  };
  $("#printBtn").onclick=()=>window.print();
})();

$("#projName").textContent=BRIEF.project;
document.title=`${BRIEF.project} · Project Brief (tree)`;
$("#foot").innerHTML=`<span>Generated ${esc(BRIEF.generated)} from docs/_global/interview.md</span><span>Derived — do not hand-edit</span>`;
summary();
render();
</script>
</body>
</html>
